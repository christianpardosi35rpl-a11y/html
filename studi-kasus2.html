<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        body {font-family: Arial; max-width: 420px; margin: 40px auto;}
        li {margin: 8px 0; cursor: pointer;}
        li.selesai {text-decoration: line-through; color: gray;} 
        li.button {margin-left: 10px;}
    </style>
</head>
<body>
    <h2>To Do List</h2>
    <input type="text" id="tugas" placeholder="Tulis tugas ...">
    <button id="btnTambah">Tambah</button>
    <button id="btnHapusSelesai">Hapus Semua Tugas Selesai</button>
    <p>Tugas Belum Selesai: <b id="jumlah">0</b></p>
    <ul id="daftar"></ul>

    <script>
        const tugas = document.getElementById('tugas');
        const btnTambah = document.getElementById('btnTambah');
        const daftar = document.getElementById('daftar');
        const jumlah = document.getElementById('jumlah');

        function hitungTugas () {
            const semua = document.querySelectorAll('#daftar li');
            const selesai = document.querySelectorAll('#daftar li.selesai');
            jumlah.textContent = semua.length - selesai.length
        }

        function Tambahtugas () {
            if (tugas.value.trim () === '') {
                alert('Tugas Tidak Boleh Kosong!');
                return;
            }

        const li = document.createElement('li');
        const teks = document.createElement('span');
        teks.textContent = tugas.value;

        teks.addEventListener('click' , () => {
            li.classList.toggle('selesai');
            hitungTugas ();
        });

        const btnHapus = document.createElement('button')
        btnHapus.textContent = 'Hapus';
        btnHapus.addEventListener ('click' , () => {
            li.remove ();
            hitungTugas ();
        });

        li.appendChild(teks);
        li.appendChild(btnHapus);
        daftar.appendChild(li);

        tugas.value = '';
        hitungTugas();
        }

        btnTambah.addEventListener('click' , Tambahtugas);
        tugas.addEventListener ('keydown' , (e) => {
            if (e.key === 'Enter') {
                Tambahtugas();

        }

        const btnHapusSelesai = document.getElementById('btnHapusSelesai')

        btnHapusSelesai.addEventListener ('click' , () => {
         const selesai = document.querySelectorAll ('#daftar li.selesai');
         selesai.forEach((li) => {
            li.remove();
         });
          hitungTugas();
        })
        });
    </script>
</body>
</html>
