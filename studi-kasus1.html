<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Seikolah</title>
    <style>
        body {font-family: Arial; padding: 30px; background: white; color: black;}
        body.gelap {background: #1e1e1e; color: #f5f5f5; }
        .kotak {background-color: #eeee; color: black; padding: 20px; margin-top: 20px; border-radius: 20px;}
        body.gelap .kotak {background: #333333; color: white;} 
    </style>
</head>
<body>
    <h1>Smk Maju Jaya</h1>
    <p>Jurusan Rekayasa Perangkat Lunak</p>
    <button id="btnTema">Mode Gelap</button>

    <div class="kotak">
     <h3>Informasi Sekolah</h3>
     <p>Smk Maju Jaya Memiliki Jurusan Rekayasa Perangkat Lunak</p>
    </div>


    <script>
        const btnTema = document.getElementById ('btnTema');

        btnTema.addEventListener ('click', () => {
            document.body.classList.toggle('gelap');

            if (document.body.classList.contains('gelap')) {
                btnTema.textContent ='Mode Terang'
            } else {
                btnTema.textContent ='Mode Gelap'
            } 
        })
    </script>
</body>
</html>
